name: swrad
on:
  schedule:
    - cron: "*/10 * * * *"     # 천리안 SWRAD 10분 간격 (GitHub 예약 실행은 몇 분 늦을 수 있음)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet netCDF4 numpy
      - uses: actions/cache@v4
        with:
          path: latlon
          key: gk2a-latlon-ko-v1
      - run: python swrad.py
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
